<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data: blob:; media-src blob: data:">
<title>Motion Editor</title>
<style>
:root{--bg:#14161c;--panel:#1c1f27;--line:#2c303b;--tx:#e6e8ee;--dim:#8b90a0;--ac:#8b5cf6}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:14px "Segoe UI",Tahoma,sans-serif;display:grid;grid-template-columns:280px 1fr 250px;grid-template-rows:46px 1fr 235px;grid-template-areas:"top top top" "layers stage props" "tl tl tl"}
button,input,select{font:inherit;color:var(--tx);background:#262a35;border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac)}

.ui-ico{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;flex:none}
.ui-ico-sm{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;vertical-align:-1.5px;flex:none}

#top{grid-area:top;display:flex;gap:6px;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;white-space:nowrap}
#top b{margin-inline-end:10px}#top .sp{flex:1;min-width:8px}
.ac{background:var(--ac);border-color:var(--ac);color:#fff}

#layers{grid-area:layers;background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.lhdr{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:#181b22;flex-shrink:0}
.lhdr-title{font-size:12px;font-weight:700;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lhdr-acts{display:flex;align-items:center;gap:4px;position:relative}
.more-btn{padding:2px 8px;font-size:15px;line-height:1;font-weight:700;background:#242936}
.more-btn.on{background:var(--ac);border-color:var(--ac);color:#fff}
.more-menu{position:fixed;z-index:55;min-width:210px;background:#202430;border:1px solid #383f52;border-radius:9px;padding:5px;box-shadow:0 12px 32px rgba(0,0,0,.65);display:none;flex-direction:column;gap:2px}
.more-menu.open{display:flex}
.more-menu button{display:flex;align-items:center;justify-content:flex-start;gap:8px;width:100%;text-align:start;background:transparent;border-color:transparent;padding:7px 10px;font-size:12px;border-radius:6px}
.more-menu button:hover:not(:disabled){background:#2c3242;border-color:#3f475d}
.more-menu button.active-clip{background:#2d2244;border-color:var(--ac);color:#c4b5fd}
.more-sep{height:1px;background:#2e3445;margin:3px 4px}

.litem .clip-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:1px 6px;border-radius:4px;background:#2d2244;color:#c4b5fd;border:1px solid rgba(139,92,246,.45);flex:none}
.g.hid .gname{opacity:.4;text-decoration:line-through}
.eye-off{opacity:.45}

/* Alight Motion style tools panel */
#ambox{background:#171a21;padding:8px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:140px;overflow:auto}
.am-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;flex-shrink:0}
.am-bar button{padding:6px 2px;display:grid;place-items:center;background:#232732;border-radius:6px}
.am-bar button.on{background:#2d2244;border-color:var(--ac);color:#c4b5fd}
.am-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;flex-shrink:0}
.am-grid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;background:#232732;font-size:11px;text-align:center;line-height:1.2}
.am-grid button.on{background:#2d2244;border-color:var(--ac);color:var(--tx)}
.am-grid svg,.am-bar svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.am-sub{background:#1f232d;border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:6px;font-size:12px}
.am-sub label{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:6px;color:var(--dim)}
.am-sub input,.am-sub select{width:100%;min-width:0;padding:4px 6px;font-size:12px}
.am-sub .two{display:flex;gap:4px}
.am-sub .two button{flex:1;padding:4px;font-size:11px}
.am-sub .two button.on{background:var(--ac);border-color:var(--ac);color:#fff}

.fx-param-row{display:grid;grid-template-columns:96px 1fr 48px;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
.fx-param-row input[type=range]{width:100%;min-width:0;accent-color:var(--ac);padding:0}
.fx-param-row span{text-align:end;color:var(--tx);font-variant-numeric:tabular-nums}
.fx-sel-row{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.fx-toggle-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:5px 8px;font-size:11px;background:#232836;border:1px solid var(--line);border-radius:6px}
.fx-toggle-btn.on{background:#2d2244;border-color:var(--ac);color:#c4b5fd}

/* Compact Color & Fill dock at bottom */
#filldock{display:none;direction:ltr;height:100%;background:#151821;border-top:1px solid var(--line);flex-direction:column;overflow:hidden}
body.fill-open #filldock{display:flex}
body.fill-open #tl .ctl,
body.fill-open #tlscroll,
body.fill-open #mtdock{display:none !important}
body.fill-open #tl{padding:4px 10px;gap:4px}

.cf-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:4px;border-bottom:1px solid #242938;flex-shrink:0}
.cf-tabs{display:flex;gap:6px}
.cf-tabs button{padding:4px 10px;font-size:12px;background:#1e2330}
.cf-tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.cf-close{padding:3px 9px;font-size:11px;background:#232836;display:inline-flex;align-items:center;gap:4px}

.cf-compact-body{flex:1;min-height:0;display:flex;align-items:center;gap:14px;padding:6px 4px;overflow:auto}
.cf-solid-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%}
.cf-solid-row input[type=color]{width:46px;height:34px;padding:2px;border-radius:6px;cursor:pointer}
.cf-solid-row input[type=range]{width:120px;accent-color:var(--ac)}
.cf-quick-cols{display:flex;gap:5px;flex-wrap:wrap}
.cf-quick-cols button{width:24px;height:24px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.25)}

/* Gradient stops slider with diamond handles */
.cf-grad-compact{display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:100%}
.cf-kind-group{display:flex;gap:5px;flex:none}
.cf-kind-group button{padding:5px 10px;font-size:11px;background:#1e2330;display:inline-flex;align-items:center;gap:5px}
.cf-kind-group button.on{background:#2d3448;border-color:#93c5fd;color:#fff}

.cf-slider-wrap{position:relative;flex:1;min-width:220px;max-width:380px;height:34px;display:flex;align-items:center;padding:0 10px;background:#1d212c;border:1px solid #2f3546;border-radius:8px;direction:ltr}
.cf-grad-track{position:relative;width:100%;height:16px;border-radius:4px;border:1.5px solid #e6e8ee;cursor:crosshair;touch-action:none}
.cf-diamond{position:absolute;top:50%;width:15px;height:15px;transform:translate(-50%,-50%) rotate(45deg);border:2px solid #ffffff;box-shadow:0 1px 5px rgba(0,0,0,.75);cursor:grab;z-index:2;transition:transform .08s}
.cf-diamond.on{border-color:#a78bfa;box-shadow:0 0 0 2px #ffffff,0 2px 8px rgba(0,0,0,.9);transform:translate(-50%,-50%) rotate(45deg) scale(1.16);z-index:4}
.cf-diamond:active{cursor:grabbing}

.cf-stop-edit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--dim);flex:none}
.cf-stop-edit input[type=color]{width:34px;height:28px;padding:1px;border-radius:5px;cursor:pointer}
.cf-stop-edit input[type=range]{width:90px;accent-color:var(--ac)}
.cf-stop-edit button{padding:4px 8px;font-size:11px;background:#232836}

.fx-add-btn{width:100%;padding:9px;background:#262b38;border:1px dashed #4a5166;border-radius:8px;color:var(--tx);font-weight:600;text-align:center}
.fx-add-btn:hover{border-color:var(--ac);background:#262038}
.fx-card{background:#181b22;border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:6px}
.fx-top{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:600;color:var(--tx)}
.fx-top-left{display:flex;align-items:center;gap:7px;min-width:0}
.fx-mini-img{width:28px;height:20px;border-radius:4px;object-fit:cover;border:1px solid #353b4d;flex:none}
.fx-top button{padding:2px 7px;font-size:11px;background:#262a35;display:inline-flex;align-items:center;justify-content:center}
.fx-back{background:#232732;font-size:11px;padding:5px 8px;text-align:center}

/* Effects browser */
#fxbrowser{position:fixed;inset:0;z-index:40;background:rgba(12,14,19,.86);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px}
#fxbrowser.open{display:flex}
.fxb-win{width:min(940px,96vw);max-height:88vh;background:#191c24;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.65)}
.fxb-hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#1f232d}
.fxb-hd input{flex:1;max-width:280px;background:#14171e}
.fxb-hd b{flex:1;text-align:center;font-size:15px}
.fxb-body{flex:1;overflow:auto;padding:14px;display:grid;gap:16px}
.fxb-sec-title{font-size:13px;font-weight:700;color:#c4b5fd;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.fxb-pop-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.fxb-pop-card{background:#222632;border:1px solid var(--line);border-radius:8px;padding:7px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px}
.fxb-pop-card:hover{border-color:var(--ac);background:#272236}
.fxb-pop-img{width:100%;aspect-ratio:16/10;border-radius:6px;object-fit:cover;display:block;border:1px solid #343a4b;background:#12151c}
.fxb-recent-wrap{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.fxb-recent-chip{flex:none;background:#222632;border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:7px;font-size:11px}
.fxb-recent-chip:hover{border-color:var(--ac)}
.fxb-recent-img{width:38px;height:24px;border-radius:4px;object-fit:cover;border:1px solid #353b4d}
.fxb-cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (max-width:680px){.fxb-cats{grid-template-columns:1fr}}
.fxb-cat-box{background:#14171e;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fxb-cat-head{background:#222632;padding:8px 12px;font-weight:700;font-size:12px;border-bottom:1px solid var(--line);color:var(--tx)}
.fxb-cat-list{padding:6px;display:grid;gap:5px}
.fxb-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;background:#1b1f29;border:1px solid transparent;font-size:12px;text-align:start;width:100%}
.fxb-item-left{display:flex;align-items:center;gap:9px;min-width:0}
.fxb-item-img{width:46px;height:30px;border-radius:5px;object-fit:cover;flex:none;border:1px solid #32384a;background:#101319}
.fxb-item:hover{border-color:var(--ac);background:#252a37}
.fxb-item small{color:var(--dim);font-size:10px;flex:none}

#stage{grid-area:stage;position:relative;min-width:0;min-height:0;overflow:hidden;background:#101218}
canvas{position:absolute;inset:0;margin:auto;width:auto;height:auto;max-width:calc(100% - 28px);max-height:calc(100% - 28px);box-shadow:0 4px 24px rgba(0,0,0,.45),0 0 0 1px var(--line);cursor:move}
#props{grid-area:props;background:var(--panel);border-inline-start:1px solid var(--line);overflow:auto;padding:12px}
#props label{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:6px;margin-bottom:8px;color:var(--dim)}
#props input{width:100%;min-width:0;color:var(--tx)}

#tl{grid-area:tl;background:var(--panel);border-top:1px solid var(--line);padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
.hint{color:var(--dim);padding:6px;font-size:12px}

/* Project settings dialog */
#dlg{position:fixed;inset:0;z-index:60;background:rgba(8,10,15,.78);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;margin:0;border:0;width:100vw;max-width:100vw;height:100vh;max-height:100vh}
#dlg.open{display:flex}
.dlg-card{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:20px 22px;width:min(460px,95vw);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.dlg-card h2{margin:0 0 14px;font-size:17px}
.dlg-card label{display:grid;grid-template-columns:135px 1fr;align-items:center;gap:8px;margin-bottom:10px;color:var(--dim)}
.dlg-card input,.dlg-card select{width:100%;min-width:0}
.two{display:flex;gap:6px;align-items:center}
#sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 16px}
#sw button{display:flex;align-items:center;gap:8px;padding:6px 8px;text-align:start}
#sw button i{width:20px;height:20px;border-radius:4px;border:1px solid #555;flex:none}
#sw button.on{border-color:var(--ac);background:#28203c;box-shadow:0 0 0 1px var(--ac)}
#sw small{color:var(--dim);display:block;font-size:11px}
.chk{background:repeating-conic-gradient(#999 0% 25%,#ddd 0% 50%) 50%/10px 10px}
.btns{display:flex;gap:8px;justify-content:flex-start}
#pname{color:var(--dim);font-size:12px;margin-inline-start:4px}

#fab{position:absolute;right:16px;bottom:16px;z-index:12;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#plus{width:54px;height:54px;border-radius:50%;background:var(--ac);border-color:var(--ac);color:#fff;font-size:30px;line-height:1;padding:0 0 2px;box-shadow:0 4px 16px rgba(0,0,0,.55);transition:transform .15s}
#plus[aria-expanded=true]{transform:rotate(45deg)}

.ctl{direction:ltr;display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.ctl .sp{flex:1;min-width:6px}
.ctl button{padding:4px 9px;min-width:30px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.pb-group{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:8px;background:#171a22;border:1px solid rgba(139,92,246,.45)}
.hist-group{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border-radius:8px;background:#171a22;border:1px solid #2d3242}
.hist-group button{padding:4px 7px;min-width:28px;background:#222734;border-color:#303648;color:var(--tx)}
.hist-group button:hover:not(:disabled){background:#2c2442;border-color:var(--ac);color:#ddd6fe}
#tt{color:var(--dim);font-size:12px;white-space:nowrap;margin-inline-start:4px}
.ctl label{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;white-space:nowrap}
#zoom{accent-color:var(--ac);width:95px}

#tlscroll{flex:1;overflow:auto;direction:ltr;position:relative;border:1px solid var(--line);border-radius:6px;background:#161920;min-height:70px}
#tlc{position:relative;min-height:100%}
.ruler,.lane{display:flex}
.ruler{position:sticky;top:0;z-index:4;background:#1c1f27;border-bottom:1px solid var(--line);height:26px}
.g{flex:none;width:168px;position:sticky;left:0;z-index:3;background:#1c1f27;border-right:1px solid var(--line);padding:0 6px;display:flex;align-items:center;gap:4px;font-size:12px;overflow:hidden;color:var(--dim);cursor:pointer;direction:ltr}
.g .gname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.g .gmv{display:flex;gap:2px}
.g .gmv button{padding:1px 5px;font-size:10px;line-height:1.1;background:#222630;display:inline-flex;align-items:center;justify-content:center}
.g.sel{color:var(--tx);box-shadow:inset 3px 0 var(--ac)}
.rt,.la{position:relative;flex:none}
.rt{height:26px;cursor:ew-resize}
.la{height:30px;border-bottom:1px solid #20242e}
.tk{position:absolute;bottom:0;width:1px;height:10px;background:#59606f}
.tk.mn{height:6px}.tk.fr{height:3px;background:#3a4050}
.rt b{position:absolute;top:2px;font-size:10px;font-weight:400;color:var(--dim);pointer-events:none}
.clip{position:absolute;top:4px;height:22px;border-radius:5px;background:#3b4256;border:1px solid #566;cursor:grab;overflow:hidden;font-size:11px;display:flex;align-items:center;padding:0 10px;white-space:nowrap}
.clip.video{background:#2d4a6b}.clip.audio{background:#2f5a4a}.clip.image{background:#5a4a2d}
.clip.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.clip.hid{opacity:.38}
.clip .h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}
.clip .l{left:0}.clip .r{right:0}
.kfd{position:absolute;top:20px;width:9px;height:9px;background:#a78bfa;transform:translateX(-50%) rotate(45deg);cursor:pointer;z-index:2}
#phd{position:absolute;top:0;bottom:0;width:2px;background:var(--ac);pointer-events:none;z-index:5}

.aw-head{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 12px;flex-shrink:0}
#tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
#tabs button{text-align:center}
#tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#tabs small{display:block;font-size:10px;opacity:.75}
#awbody{padding:10px 14px;flex:1;min-height:0;overflow:auto}
#addpanel{grid-area:tl;background:var(--panel);border-top:1px solid var(--line);display:none;flex-direction:column;min-height:0;position:relative;z-index:10}
body.adding #addpanel{display:flex !important;grid-template-columns:none !important;grid-template-rows:none !important}
body.adding #tl,
body.adding.mt-open #tl,
body.adding.mt-open #mtdock,
body.adding.fill-open #filldock{display:none !important}

.mrow{display:flex;gap:14px;height:100%}
.mrow .drop{width:210px;flex:none;margin:0;align-self:flex-start;padding:12px}
.mcol{flex:1;min-width:0;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 6px;text-align:center}
.tile svg{width:38px;height:38px;fill:var(--ac)}
.tile small,.mi small{display:block;color:var(--dim);font-size:11px}
.aa{font-size:26px;height:38px;line-height:38px;color:var(--ac)}
.swt{display:block;width:38px;height:38px;border-radius:8px;border:1px solid #444}
.drop{border:2px dashed #3a4050;border-radius:10px;padding:16px;text-align:center;color:var(--dim);margin-bottom:10px}
.drop.over{border-color:var(--ac);color:var(--tx);background:#232733}
.drop button{margin-top:8px}
#awmsg{min-height:18px;color:var(--dim);font-size:12px;margin-bottom:6px}
.mi{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#12141a}
.mi .th{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#0e1014}
.mi .nm{padding:5px 7px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .add,.ar .add{width:28px;height:28px;border-radius:50%;background:var(--ac);border-color:var(--ac);color:#fff;padding:0 0 2px;font-size:18px;line-height:1}
.mi .add{position:absolute;top:6px;right:6px}
.ar{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.ar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{border:1px solid var(--line);border-radius:8px;padding:8px;margin:10px 0;display:grid;gap:6px}
.grp label{margin:0 !important}
.gh{color:var(--dim);font-size:12px}
.grp button{text-align:center}
.grp button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.dial{width:72px;height:72px;box-sizing:border-box;border-radius:50%;border:2px solid #3a4050;background:#12141a;position:relative;cursor:grab;margin:4px auto 8px;touch-action:none}
.dial i{position:absolute;left:calc(50% - 1.5px);top:0;width:3px;height:50%;background:var(--ac);transform-origin:50% 100%;border-radius:2px}

<body>
<div id="top">
  <b>Motion Editor</b>
  <button id="newp" type="button">New Project</button><span id="pname"></span>
  <button id="del" type="button">Delete Layer</button>
  <span class="sp"></span>
  <button id="save" type="button">Save Project</button>
  <button id="load" type="button">Open Project</button>
  <input id="file" type="file" accept=".json" hidden>
  <button id="export" class="ac" type="button">Export Video</button>
</div>

<div id="layers">
  <div class="lhdr">
    <span class="lhdr-title">Layers</span>
    <div class="lhdr-acts">
      <button id="moreBtn" class="more-btn" type="button" title="Layer Options" aria-expanded="false">⋯</button>
    </div>
  </div>
  <div id="ambox" hidden></div>
</div>

<div id="moreMenu" class="more-menu" role="menu"></div>

<div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="fab"><button id="plus" type="button" aria-label="Add" title="Add">+</button></div>
</div>

<input id="mfile" type="file" accept="image/*,video/*,audio/*" multiple hidden>

<div id="addpanel">
  <div class="aw-head"><div id="tabs"></div><button id="awx" type="button">Back to Timeline</button></div>
  <div id="awbody"></div>
</div>

<div id="props"></div>

<div id="tl">
  <div class="row ctl" id="tlControls"></div>
  <input id="time" type="range" min="0" max="5" step="0.01" value="0" hidden>
  <div id="tlscroll"><div id="tlc"></div></div>
  <div id="mtdock"></div>
  <div id="filldock"></div>
</div>

<!-- Effects Browser -->
<div id="fxbrowser" role="dialog" aria-modal="true" aria-label="Effects Browser">
  <div class="fxb-win">
    <div class="fxb-hd">
      <input id="fxbSearch" type="search" placeholder="Search effects...">
      <b>Effects Browser</b>
      <button id="fxbClose" type="button" title="Close">✕</button>
    </div>
    <div id="fxbBody" class="fxb-body"></div>
  </div>
</div>

<!-- Project Settings Dialog -->
<div id="dlg" role="dialog" aria-modal="true" aria-label="Project Settings">
  <div class="dlg-card">
    <h2>Create New Project</h2>
    <label>Project Name <input id="pn" type="text" maxlength="60" value="New Project"></label>
    <label>Size <select id="psize"></select></label>
    <label>Width × Height <span class="two"><input id="pw" type="number" min="100" max="4096"> × <input id="ph2" type="number" min="100" max="4096"></span></label>
    <label>Frame Rate (FPS) <input id="pfps" type="number" min="1" max="120" value="30"></label>
    <label>Duration (sec) <input id="pdur" type="number" min="1" max="60" value="5"></label>
    <div style="color:var(--dim);margin-bottom:6px">Background Color</div>
    <div id="sw"></div>
    <div class="btns"><button id="pok" class="ac" type="button">Create</button><button id="pcancel" type="button">Cancel</button></div>
  </div>
</div>

<script>
let DUR = 5, FPS = 30;
let P = {name:'New Project', w:1280, h:720, fps:30, dur:5, bg:'#ffffff'};
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const offCv = document.createElement('canvas'), offCtx = offCv.getContext('2d');
let layers = [], sel = null, t = 0, playing = false, last = 0, uid = 1, recording = false;
const $ = id => document.getElementById(id);

// ===== Undo / Redo History =====
const historyStack = { past: [], future: [], locked: false };

function snapshotState() {
  return {
    P: { ...P },
    t,
    sel,
    uid,
    layers: layers.map(l => {
      const copy = JSON.parse(JSON.stringify(l, (k, v) => k === 'el' ? undefined : v));
      if (l.el) copy.__el = l.el;
      return copy;
    })
  };
}

function restoreSnapshot(snap) {
  if (!snap) return;
  historyStack.locked = true;
  try {
    P = { ...snap.P };
    cv.width = P.w; cv.height = P.h; DUR = P.dur; FPS = P.fps;
    $('time').max = DUR; $('time').step = 1/FPS;
    cv.style.background = P.bg || 'repeating-conic-gradient(#777 0% 25%,#bbb 0% 50%) 50%/20px 20px';
    $('pname').textContent = `${P.name} · ${P.w}×${P.h} · ${P.fps} FPS`;
    document.title = P.name + ' — Motion Editor';

    layers = snap.layers.map(item => {
      const el = item.__el;
      const l = { ...item };
      delete l.__el;
      if (el) l.el = el;
      else if (l.src && (l.type === 'image' || l.type === 'video' || l.type === 'audio')) hydrate(l, false);
      return l;
    });
    uid = snap.uid;
    sel = snap.sel;
    t = Math.max(0, Math.min(DUR, snap.t ?? 0));
    $('time').value = t;
    $('tt').textContent = `${t.toFixed(2)}s / ${DUR}s  |  ${Math.round(t*FPS)} / ${DUR*FPS}`;
    refresh();
    movePlayhead();
    syncMedia();
  } finally {
    historyStack.locked = false;
    updateHistoryButtons();
  }
}

function recordHistory() {
  if (historyStack.locked || recording) return;
  const snap = snapshotState();
  const prev = historyStack.past[historyStack.past.length - 1];
  const serialized = JSON.stringify({ ...snap, layers: snap.layers.map(({ __el, ...rest }) => rest) });
  const prevSerialized = prev ? JSON.stringify({ ...prev, layers: prev.layers.map(({ __el, ...rest }) => rest) }) : '';
  if (serialized === prevSerialized) return;
  historyStack.past.push(snap);
  if (historyStack.past.length > 60) historyStack.past.shift();
  historyStack.future = [];
  updateHistoryButtons();
}

function undoProgress() {
  if (!historyStack.past.length) return;
  if (playing) stop();
  const current = snapshotState();
  const previous = historyStack.past.pop();
  historyStack.future.push(current);
  restoreSnapshot(previous);
}

function redoProgress() {
  if (!historyStack.future.length) return;
  if (playing) stop();
  const current = snapshotState();
  const next = historyStack.future.pop();
  historyStack.past.push(current);
  restoreSnapshot(next);
}

function updateHistoryButtons() {
  const uBtn = $('undoBtn');
  const rBtn = $('redoBtn');
  if (uBtn) uBtn.disabled = historyStack.past.length === 0;
  if (rBtn) rBtn.disabled = historyStack.future.length === 0;
}

function uiIcon(name, cls = 'ui-ico') {
  const paths = {
    eye: '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>',
    eyeOff: '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.77 21.77 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 5c7 0 11 7 11 7a21.85 21.85 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>',
    up: '<path d="M18 15l-6-6-6 6"/>',
    down: '<path d="M6 9l6 6 6-6"/>',
    scissors: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/>',
    check: '<path d="M20 6L9 17l-5-5"/>',
    close: '<path d="M18 6L6 18M6 6l12 12"/>',
    flipH: '<path d="M12 3v18M8 7l-4 5 4 5M16 7l4 5-4 5"/>',
    flipV: '<path d="M3 12h18M7 8l5-4 5 4M7 16l5 4 5-4"/>',
    fit: '<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>',
    trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
    palette: '<path d="M12 2a10 10 0 0 0 0 20c1.4 0 2.5-1.1 2.5-2.5 0-.6-.2-1.2-.6-1.6-.4-.4-.6-.9-.6-1.5 0-1.4 1.1-2.5 2.5-2.5H19a3 3 0 0 0 3-3c0-5.5-4.5-10-10-10z"/><circle cx="7.5" cy="11.5" r="1.2"/><circle cx="10.5" cy="7.5" r="1.2"/><circle cx="14.5" cy="7.5" r="1.2"/>',
    radial: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
    linear: '<line x1="5" y1="19" x2="19" y2="5"/><polyline points="12 5 19 5 19 12"/>',
    flame: '<path d="M12 3c2.5 3.2 4 5.7 4 8.5a4 4 0 1 1-8 0c0-1.7.7-3.4 2-5-1.6 1.5-2.5 3.3-2.5 5.2"/>',
    clock: '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>',
    sparkles: '<path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8L12 3z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/>',
    film: '<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="4" x2="7" y2="20"/><line x1="17" y1="4" x2="17" y2="20"/><line x1="3" y1="12" x2="21" y2="12"/>',
    refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><polyline points="21 3 21 8 16 8"/>',
    start: '<line x1="6" y1="5" x2="6" y2="19"/><polygon points="19 5 9 12 19 19"/>',
    end: '<line x1="18" y1="5" x2="18" y2="19"/><polygon points="5 5 15 12 5 19"/>',
    prev: '<polygon points="16 5 7 12 16 19"/>',
    next: '<polygon points="8 5 17 12 8 19"/>',
    play: '<polygon points="6 4 20 12 6 20"/>',
    pause: '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
    kfPrev: '<polygon points="12 7 7 12 12 17"/><line x1="17" y1="6" x2="17" y2="18"/>',
    kfNext: '<polygon points="12 7 17 12 12 17"/><line x1="7" y1="6" x2="7" y2="18"/>',
    diamond: '<polygon points="12 4 20 12 12 20 4 12"/>',
    music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>',
    redo: '<path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/>'
  };
  return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.sparkles}</svg>`;
}

function renderTransportControls() {
  const ctl = $('tlControls');
  ctl.innerHTML = '';
  const mkB = (id, html, title, cls = '', parent = ctl) => {
    const b = document.createElement('button');
    b.id = id; b.type = 'button'; b.innerHTML = html; b.title = title;
    if (cls) b.className = cls;
    parent.append(b);
    return b;
  };
  const tt = document.createElement('span'); tt.id = 'tt';

  const histGroup = document.createElement('div'); histGroup.className = 'hist-group';
  mkB('undoBtn', uiIcon('undo'), 'Undo (Ctrl+Z)', '', histGroup);
  mkB('redoBtn', uiIcon('redo'), 'Redo (Ctrl+Y)', '', histGroup);

  const pbGroup = document.createElement('div'); pbGroup.className = 'pb-group';
  mkB('tstart', uiIcon('start'), 'Start', '', pbGroup);
  mkB('tprev', uiIcon('prev'), 'Previous Frame', '', pbGroup);
  const pb = mkB('play', uiIcon('play') + '<span>Play</span>', 'Play / Pause', 'ac', pbGroup);
  pb.style.minWidth = '72px';
  mkB('tnext', uiIcon('next'), 'Next Frame', '', pbGroup);
  mkB('tend', uiIcon('end'), 'End', '', pbGroup);

  const sp = document.createElement('span'); sp.className = 'sp';
  const lbl = document.createElement('label');
  const zm = document.createElement('input'); zm.id = 'zoom'; zm.type = 'range'; zm.min = '40'; zm.max = '600'; zm.value = String(PPS);
  lbl.append('Zoom', zm);
  ctl.append(tt, histGroup, pbGroup, sp, lbl);

  zm.oninput = e => { PPS = +e.target.value; renderTimeline(); };
  $('undoBtn').onclick = undoProgress;
  $('redoBtn').onclick = redoProgress;
  $('tstart').onclick = () => { if (playing) stop(); setTime(0); };
  $('tend').onclick = () => { if (playing) stop(); setTime(DUR); };
  $('tprev').onclick = () => step(-1);
  $('tnext').onclick = () => step(1);
  $('play').onclick = () => playing ? stop() : play();
  updateHistoryButtons();
}

function setPlayBtnState(isPlaying) {
  const pb = $('play');
  if (!pb) return;
  pb.innerHTML = (isPlaying ? uiIcon('pause') : uiIcon('play')) + `<span>${isPlaying ? 'Pause' : 'Play'}</span>`;
}

function hexToRgba(hex, alpha = 1) {
  const a = Math.max(0, Math.min(1, Number(alpha ?? 1)));
  if (!hex || typeof hex !== 'string') return `rgba(68,129,139,${a})`;
  const m = hex.trim().match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if (!m) return hex;
  let h = m[1];
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

const NAMES = {roundrect:'Rounded Rectangle',video:'Video',rect:'Rectangle',ellipse:'Circle',triangle:'Triangle',star:'Star',text:'Text',gradient:'Gradient',image:'Image',audio:'Audio'};
function addLayer(type, extra = {}) {
  const isMedia = type === 'image' || type === 'video';
  const l = {
    id: uid++, type, name: (NAMES[type]||type) + ' ' + uid,
    x:cv.width/2, y:cv.height/2, w:300, h:type==='text'?90:200, sx:1, sy:1, rot:0, op:1,
    color:['#8b5cf6','#3b82f6','#f5b83d','#22c7a0'][uid%4],
    colorAlpha: 1,
    tintAlpha: 0.55,
    fillType: isMedia ? 'none' : (type === 'gradient' ? 'gradient' : 'solid'),
    gradKind:'radial',
    gradStops:[
      {pos:0, color:'#ffffff', alpha:1},
      {pos:1, color:'#000000', alpha:1}
    ],
    gradP1:{x:0, y:0},
    gradP2:{x:120, y:0},
    text:'Type here', kf:{},
    st:Math.min(t, Math.max(0, DUR-1/FPS)), en:DUR, hidden:false,
    clipMask:false,
    blend:'source-over', strokeW:0, strokeC:'#000000',
    shOn:false, shC:'#000000', shBlur:16, shX:0, shY:8,
    effects:[]
  };
  Object.assign(l, extra);
  layers.push(l); sel = l.id; refresh(); recordHistory();
  return l;
}
const cur = () => layers.find(l => l.id === sel);

function getLayerBelow(l) {
  const idx = layers.findIndex(x => x.id === l.id);
  for (let i = idx - 1; i >= 0; i--) {
    const b = layers[i];
    if (!b.hidden && b.type !== 'audio' && t >= b.st && t <= b.en) return b;
  }
  return null;
}

function ensureFill(l) {
  const isMedia = l.type === 'image' || l.type === 'video';
  if (!l.fillType) l.fillType = isMedia ? 'none' : (l.type === 'gradient' ? 'gradient' : 'solid');
  if (l.colorAlpha === undefined || !isFinite(l.colorAlpha)) l.colorAlpha = 1;
  if (l.tintAlpha === undefined || !isFinite(l.tintAlpha)) l.tintAlpha = 0.55;
  if (!l.gradKind) l.gradKind = 'radial';
  if (!Array.isArray(l.gradStops) || l.gradStops.length < 2) {
    l.gradStops = [
      {pos:0, color: l.color || '#ffffff', alpha:1},
      {pos:1, color: l.color2 || '#000000', alpha:1}
    ];
  } else {
    l.gradStops.forEach(s => { if (s.alpha === undefined || !isFinite(s.alpha)) s.alpha = 1; });
  }
  const rx = Math.max(60, (l.w || 240) * 0.45);
  const ry = Math.max(60, (l.h || 240) * 0.45);
  if (!l.gradP1) l.gradP1 = {x: 0, y: 0};
  if (!l.gradP2) l.gradP2 = l.gradKind === 'radial' ? {x: rx, y: 0} : {x: 0, y: ry};
}

function getSortedStops(l) {
  ensureFill(l);
  return [...l.gradStops].sort((a, b) => a.pos - b.pos);
}

function buildCanvasFill(l, targetCtx = ctx) {
  ensureFill(l);
  if (l.fillType !== 'gradient' && l.type !== 'gradient') {
    return hexToRgba(l.color, l.colorAlpha ?? 1);
  }
  const stops = getSortedStops(l);
  const p1 = l.gradP1, p2 = l.gradP2;
  let gr;
  if (l.gradKind === 'radial') {
    const r = Math.max(8, Math.hypot(p2.x - p1.x, p2.y - p1.y));
    gr = targetCtx.createRadialGradient(p1.x, p1.y, 0, p1.x, p1.y, r);
  } else {
    gr = targetCtx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
  }
  stops.forEach(s => gr.addColorStop(Math.max(0, Math.min(1, s.pos)), hexToRgba(s.color, s.alpha ?? 1)));
  return gr;
}

function makeFxThumb(fxId) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 80;
  const g = c.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 128, 80);
  bg.addColorStop(0, '#1e2436'); bg.addColorStop(1, '#261d3d');
  g.fillStyle = bg; g.fillRect(0, 0, 128, 80);

  if (fxId === 'autoshake') {
    g.strokeStyle = '#a78bfa'; g.lineWidth = 3;
    g.beginPath();

    targetCtx.fillStyle = fillStyle;
    targetCtx.beginPath(); targetCtx.ellipse(0,0,l.w/2,l.h/2,0,0,Math.PI*2); targetCtx.fill();
    if (strokeWidth > 0) { targetCtx.strokeStyle = strokeStyle; targetCtx.lineWidth = strokeWidth; targetCtx.stroke(); }
  } else if (l.type==='roundrect') {
    targetCtx.fillStyle = fillStyle;
    targetCtx.beginPath(); targetCtx.roundRect(-l.w/2,-l.h/2,l.w,l.h,Math.min(l.w,l.h)*0.22); targetCtx.fill();
    if (strokeWidth > 0) { targetCtx.strokeStyle = strokeStyle; targetCtx.lineWidth = strokeWidth; targetCtx.stroke(); }
  } else if (l.type==='triangle') {
    targetCtx.fillStyle = fillStyle;
    targetCtx.beginPath(); targetCtx.moveTo(0,-l.h/2); targetCtx.lineTo(l.w/2,l.h/2); targetCtx.lineTo(-l.w/2,l.h/2); targetCtx.closePath(); targetCtx.fill();
    if (strokeWidth > 0) { targetCtx.strokeStyle = strokeStyle; targetCtx.lineWidth = strokeWidth; targetCtx.stroke(); }
  } else if (l.type==='star') {
    targetCtx.fillStyle = fillStyle;
    targetCtx.beginPath(); for (let i=0;i<10;i++) { const r=i%2?0.45:1, a=-Math.PI/2+i*Math.PI/5; targetCtx.lineTo(Math.cos(a)*r*l.w/2, Math.sin(a)*r*l.h/2); } targetCtx.closePath(); targetCtx.fill();
    if (strokeWidth > 0) { targetCtx.strokeStyle = strokeStyle; targetCtx.lineWidth = strokeWidth; targetCtx.stroke(); }
  } else if (l.type==='image' || l.type==='video') {
    if (l.el && (l.el.complete || l.el.readyState >= 2)) {
      targetCtx.drawImage(l.el,-l.w/2,-l.h/2,l.w,l.h);
      const alpha = l.fillType === 'none' ? 0 : Math.max(0, Math.min(1, l.tintAlpha ?? 0.55));
      if (alpha > 0) {
        targetCtx.save();
        targetCtx.globalAlpha = targetCtx.globalAlpha * alpha;
        targetCtx.fillStyle = fillStyle;
        targetCtx.fillRect(-l.w/2,-l.h/2,l.w,l.h);
        targetCtx.restore();
      }
      if (strokeWidth > 0) {
        targetCtx.strokeStyle = strokeStyle; targetCtx.lineWidth = strokeWidth;
        targetCtx.strokeRect(-l.w/2,-l.h/2,l.w,l.h);
      }
    }
  } else if (l.type==='text') {
    targetCtx.fillStyle = fillStyle;
    targetCtx.font = `bold ${l.h}px "Segoe UI",Tahoma,sans-serif`; targetCtx.textAlign='center'; targetCtx.textBaseline='middle';
    targetCtx.fillText(l.text,0,0);
    if (strokeWidth > 0) { targetCtx.strokeStyle = strokeStyle; targetCtx.lineWidth = strokeWidth; targetCtx.strokeText(l.text,0,0); }
  }
  if (fxInfo?.cmykStep > 0) {
    const st = fxInfo.cmykStep;
    targetCtx.fillStyle = 'rgba(139,92,246,0.35)';
    for (let x = -w/2; x <= w/2; x += st) for (let y = -l.h/2; y <= l.h/2; y += st) {
      targetCtx.beginPath(); targetCtx.arc(x, y, Math.max(1.5, st*0.18), 0, Math.PI*2); targetCtx.fill();
    }
  }
}

function drawTiledOrSingle(targetCtx, l, w, fx) {
  if (fx.tileScale > 1.01) {
    const stepX = Math.max(40, w * 1.1);
    const stepY = Math.max(40, l.h * 1.1);
    for (let gx = -2; gx <= 2; gx++) {
      for (let gy = -2; gy <= 2; gy++) {
        targetCtx.save();
        const extraX = fx.tileVert ? (gy % 2) * (stepX * 0.5) : 0;
        const extraY = (!fx.tileVert && fx.tileOffset) ? (gx % 2) * fx.tileOffset : 0;
        targetCtx.translate(gx * stepX + extraX + fx.tileOffset, gy * stepY + extraY);
        if (fx.tileAngle) targetCtx.rotate((fx.tileAngle * Math.PI) / 180);
        if (fx.tileMirror) {
          targetCtx.scale(Math.abs(gx) % 2 === 1 ? -1 : 1, Math.abs(gy) % 2 === 1 ? -1 : 1);
        }
        drawLayerBody(l, w, fx, targetCtx);
        targetCtx.restore();
      }
    }
  } else {
    targetCtx.save();
    if (fx.tileOffset) targetCtx.translate(fx.tileOffset, 0);
    if (fx.tileAngle) targetCtx.rotate((fx.tileAngle * Math.PI) / 180);
    if (fx.tileMirror) targetCtx.scale(-1, 1);
    drawLayerBody(l, w, fx, targetCtx);
    targetCtx.restore();
  }
}

function drawLayerMaskShape(target, l, fx) {
  target.save();
  target.translate(get(l,'x',t) + fx.waveX + fx.dx, get(l,'y',t) + fx.dy);
  target.rotate((get(l,'rot',t) + fx.dRot)*Math.PI/180);
  const sx = get(l,'sx',t) * fx.scaleBoost, sy = get(l,'sy',t) * fx.scaleBoost;
  target.scale(sx / fx.tileScale, sy / fx.tileScale);
  target.fillStyle = '#ffffff';
  target.strokeStyle = '#ffffff';

  const drawSingleShape = () => {
    if (l.type==='rect' || l.type==='gradient' || l.type==='image' || l.type==='video') {
      target.fillRect(-l.w/2,-l.h/2,l.w,l.h);
    } else if (l.type==='ellipse') {
      target.beginPath(); target.ellipse(0,0,l.w/2,l.h/2,0,0,Math.PI*2); target.fill();
    } else if (l.type==='roundrect') {
      target.beginPath(); target.roundRect(-l.w/2,-l.h/2,l.w,l.h,Math.min(l.w,l.h)*0.22); target.fill();
    } else if (l.type==='triangle') {
      target.beginPath(); target.moveTo(0,-l.h/2); target.lineTo(l.w/2,l.h/2); target.lineTo(-l.w/2,l.h/2); target.closePath(); target.fill();
    } else if (l.type==='star') {
      target.beginPath(); for (let i=0;i<10;i++) { const r=i%2?0.45:1, a=-Math.PI/2+i*Math.PI/5; target.lineTo(Math.cos(a)*r*l.w/2, Math.sin(a)*r*l.h/2); } target.closePath(); target.fill();
    } else if (l.type==='text') {
      target.font = `bold ${l.h}px "Segoe UI",Tahoma,sans-serif`; target.textAlign='center'; target.textBaseline='middle';
      target.fillText(l.text,0,0);
    }
  };

  if (fx.tileScale > 1.01) {
    const w = l.type==='text' ? target.measureText(l.text).width : l.w;
    const stepX = Math.max(40, w * 1.1), stepY = Math.max(40, l.h * 1.1);
    for (let gx = -2; gx <= 2; gx++) {
      for (let gy = -2; gy <= 2; gy++) {
        target.save();
        const extraX = fx.tileVert ? (gy % 2) * (stepX * 0.5) : 0;
        target.translate(gx * stepX + extraX + fx.tileOffset, gy * stepY);
        if (fx.tileAngle) target.rotate((fx.tileAngle * Math.PI) / 180);
        drawSingleShape();
        target.restore();
      }
    }
  } else {
    drawSingleShape();
  }
  target.restore();
}

function renderLayerToOffscreen(l, fx) {
  if (offCv.width !== cv.width || offCv.height !== cv.height) {
    offCv.width = cv.width; offCv.height = cv.height;
  }
  offCtx.clearRect(0, 0, offCv.width, offCv.height);
  offCtx.save();
  offCtx.translate(get(l,'x',t) + fx.waveX + fx.dx, get(l,'y',t) + fx.dy);
  offCtx.rotate((get(l,'rot',t) + fx.dRot)*Math.PI/180);
  const sx = get(l,'sx',t) * fx.scaleBoost, sy = get(l,'sy',t) * fx.scaleBoost;
  offCtx.scale(sx / fx.tileScale, sy / fx.tileScale);
  offCtx.globalAlpha = Math.max(0, Math.min(1, get(l,'op',t) * fx.fadeMult));
  offCtx.filter = fx.filter;

  if (l.shOn) {
    offCtx.shadowColor = l.shC || '#000000';
    offCtx.shadowBlur = l.shBlur ?? 16;
    offCtx.shadowOffsetX = l.shX ?? 0;
    offCtx.shadowOffsetY = l.shY ?? 8;
  } else if (fx.glowBlur > 0) {
    offCtx.shadowColor = l.color || '#8b5cf6';
    offCtx.shadowBlur = fx.glowBlur;
  }

  const w = l.type==='text' ? offCtx.measureText(l.text).width : l.w;
  drawTiledOrSingle(offCtx, l, w, fx);
  offCtx.restore();
}

function drawGradientHandles(l, s) {
  if (!document.body.classList.contains('fill-open') || !l || (l.fillType !== 'gradient' && l.type !== 'gradient')) return;
  ensureFill(l);
  const p1 = l.gradP1, p2 = l.gradP2;
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.filter = 'none';
  ctx.setLineDash([]);
  ctx.strokeStyle = '#a78bfa';
  ctx.lineWidth = 2/s;
  ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();

  [p1, p2].forEach(ptObj => {
    ctx.beginPath(); ctx.arc(ptObj.x, ptObj.y, 7/s, 0, Math.PI*2);
    ctx.fillStyle = '#7c3aed'; ctx.fill();
    ctx.lineWidth = 2/s; ctx.strokeStyle = '#ffffff'; ctx.stroke();
  });
  ctx.restore();
}

function draw() {
  ctx.clearRect(0,0,cv.width,cv.height);
  if (P.bg) { ctx.fillStyle = P.bg; ctx.fillRect(0,0,cv.width,cv.height); }
  for (const l of layers) {
    if (l.hidden || l.type==='audio' || t < l.st || t > l.en) continue;
    const fx = evalEffects(l);
    const below = l.clipMask ? getLayerBelow(l) : null;

    if (below) {
      const belowFx = evalEffects(below);
      renderLayerToOffscreen(l, fx);
      offCtx.save();
      offCtx.globalCompositeOperation = 'destination-in';
      offCtx.filter = 'none';
      offCtx.globalAlpha = 1;
      drawLayerMaskShape(offCtx, below, belowFx);
      offCtx.restore();

      ctx.save();
      ctx.globalCompositeOperation = l.blend || 'source-over';
      ctx.drawImage(offCv, 0, 0);
      ctx.restore();
    } else {
      ctx.save();
      ctx.translate(get(l,'x',t) + fx.waveX + fx.dx, get(l,'y',t) + fx.dy);
      ctx.rotate((get(l,'rot',t) + fx.dRot)*Math.PI/180);
      const sx = get(l,'sx',t) * fx.scaleBoost, sy = get(l,'sy',t) * fx.scaleBoost;
      ctx.scale(sx / fx.tileScale, sy / fx.tileScale);
      ctx.globalAlpha = Math.max(0, Math.min(1, get(l,'op',t) * fx.fadeMult));
      ctx.globalCompositeOperation = l.blend || 'source-over';
      ctx.filter = fx.filter;

      if (l.shOn) {
        ctx.shadowColor = l.shC || '#000000';
        ctx.shadowBlur = l.shBlur ?? 16;
        ctx.shadowOffsetX = l.shX ?? 0;
        ctx.shadowOffsetY = l.shY ?? 8;
      } else if (fx.glowBlur > 0) {
        ctx.shadowColor = l.color || '#8b5cf6';
        ctx.shadowBlur = fx.glowBlur;
      }

      const w = l.type==='text' ? ctx.measureText(l.text).width : l.w;
      drawTiledOrSingle(ctx, l, w, fx);
      ctx.restore();
    }

    ctx.save();
    ctx.shadowColor = 'transparent'; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
    if (l.id===sel && !recording) {
      const sx = get(l,'sx',t) * fx.scaleBoost, sy = get(l,'sy',t) * fx.scaleBoost, s = Math.max(Math.abs(sx), Math.abs(sy)) || 1;
      ctx.translate(get(l,'x',t) + fx.waveX + fx.dx, get(l,'y',t) + fx.dy);
      ctx.rotate((get(l,'rot',t) + fx.dRot)*Math.PI/180);
      ctx.scale(sx / fx.tileScale, sy / fx.tileScale);
      ctx.font = `bold ${l.h}px "Segoe UI",Tahoma,sans-serif`;
      const w = l.type==='text' ? ctx.measureText(l.text).width : l.w;
      ctx.globalAlpha = 1; ctx.strokeStyle = '#8b5cf6'; ctx.lineWidth = 3/s; ctx.setLineDash([10/s,6/s]);
      ctx.strokeRect(-w/2-6,-l.h/2-6,w+12,l.h+12);
      drawGradientHandles(l, s);
    }
    ctx.restore();
  }
}

// ===== More Menu (⋯) & Clipping Mask =====
function toggleClippingMask() {
  const l = cur();
  if (!l || l.type === 'audio') return;
  l.clipMask = !l.clipMask;
  closeMoreMenu();
  refresh();
  recordHistory();
}

function flipLayer(axis) {
  const l = cur();
  if (!l || l.type === 'audio') return;
  if (axis === 'x') setProp(l, 'sx', -get(l, 'sx', t));
  else setProp(l, 'sy', -get(l, 'sy', t));
  closeMoreMenu();
  refresh();
  recordHistory();
}

function fitComposition(mode) {
  const l = cur();
  if (!l || l.type === 'audio') return;
  const w = l.type === 'text' ? Math.max(60, l.text.length * l.h * 0.55) : l.w;
  const h = l.h || 100;
  if (mode === 'match') {
    const k = Math.min(cv.width / w, cv.height / h);
    setProp(l, 'x', cv.width / 2);
    setProp(l, 'y', cv.height / 2);
    setProp(l, 'sx', +k.toFixed(4));
    setProp(l, 'sy', +k.toFixed(4));
  } else if (mode === 'fill') {
    const k = Math.max(cv.width / w, cv.height / h);
    setProp(l, 'x', cv.width / 2);
    setProp(l, 'y', cv.height / 2);
    setProp(l, 'sx', +k.toFixed(4));
    setProp(l, 'sy', +k.toFixed(4));
  } else if (mode === 'stretch') {
    setProp(l, 'x', cv.width / 2);
    setProp(l, 'y', cv.height / 2);
    setProp(l, 'sx', +(cv.width / w).toFixed(4));
    setProp(l, 'sy', +(cv.height / h).toFixed(4));
  }
  closeMoreMenu();
  refresh();
  recordHistory();
}

function closeMoreMenu() {
  $('moreMenu').classList.remove('open');
  $('moreBtn').setAttribute('aria-expanded', 'false');
}

function openMoreMenu() {
  const l = cur(), menu = $('moreMenu'), btn = $('moreBtn');
  menu.innerHTML = '';
  const mkBtn = (ico, txt, fn, opts = {}) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = (ico ? uiIcon(ico, 'ui-ico-sm') : '') + `<span>${txt}</span>`;
    if (opts.disabled) b.disabled = true;
    if (opts.active) b.classList.add('active-clip');
    b.onclick = fn;
    menu.append(b);
  };

  if (!l) {
    mkBtn('', 'Select a layer first', closeMoreMenu, {disabled: true});
  } else {
    const isClip = !!l.clipMask;
    mkBtn(
      isClip ? 'check' : 'scissors',
      isClip ? 'Release Clipping Mask' : 'Create Clipping Mask',
      toggleClippingMask,
      {active: isClip, disabled: l.type === 'audio'}
    );
    menu.append(Object.assign(document.createElement('div'), {className: 'more-sep'}));
    mkBtn('flipH', 'Flip Horizontal', () => flipLayer('x'), {disabled: l.type === 'audio'});
    mkBtn('flipV', 'Flip Vertical', () => flipLayer('y'), {disabled: l.type === 'audio'});
    menu.append(Object.assign(document.createElement('div'), {className: 'more-sep'}));
    mkBtn('fit', 'Fit to Composition', () => fitComposition('match'), {disabled: l.type === 'audio'});
    mkBtn('fit', 'Fill Composition', () => fitComposition('fill'), {disabled: l.type === 'audio'});
    mkBtn('fit', 'Stretch to Composition', () => fitComposition('stretch'), {disabled: l.type === 'audio'});
    menu.append(Object.assign(document.createElement('div'), {className: 'more-sep'}));
    mkBtn('trash', 'Delete Layer', () => { closeMoreMenu(); $('del').click(); });
  }

  const r = btn.getBoundingClientRect();
  menu.style.top = Math.min(window.innerHeight - 240, r.bottom + 6) + 'px';
  menu.style.left = Math.max(8, r.left) + 'px';
  menu.classList.add('open');
  btn.setAttribute('aria-expanded', 'true');
}

$('moreBtn').onclick = e => {
  e.stopPropagation();
  if ($('moreMenu').classList.contains('open')) closeMoreMenu();
  else openMoreMenu();
};
document.addEventListener('click', e => {
  if (!$('moreMenu').contains(e.target) && e.target !== $('moreBtn')) closeMoreMenu();
});

function refresh() { drawLayers(); drawAMTools(); drawProps(); drawTracks(); draw(); updateHistoryButtons(); }
function drawLayers() {
  const l = cur(), hdrTitle = document.querySelector('.lhdr-title');
  if (hdrTitle) hdrTitle.textContent = l ? `Layers · ${l.name}` : 'Layers';
}

// ===== Compact Color & Fill Dock =====
let fillSubTab = 'solid';
let activeGradStop = 0;

function openFillDock() {
  if (!cur()) return;
  document.body.classList.remove('mt-open');
  document.body.classList.remove('adding');
  $('plus').setAttribute('aria-expanded','false');
  ensureFill(cur());
  fillSubTab = cur().fillType || 'solid';
  if (activeGradStop >= cur().gradStops.length) activeGradStop = 0;
  document.body.classList.add('fill-open');
  renderFillDock();
  drawAMTools();
  draw();
}
function closeFillDock() {
  document.body.classList.remove('fill-open');
  renderTimeline();
  drawAMTools();
  draw();
}
function toggleFillDock() {
  if (document.body.classList.contains('fill-open')) closeFillDock();
  else openFillDock();
}

const PALETTE = ['#8b5cf6','#3b82f6','#22c55e','#facc15','#a855f7','#06b6d4','#f97316','#ffffff','#111827'];

function renderFillDock() {
  const dock = $('filldock'), l = cur();
  if (!dock || !document.body.classList.contains('fill-open')) return;
  dock.innerHTML = '';
  if (!l || l.type === 'audio') {
    const h = document.createElement('div'); h.className = 'ehint'; h.textContent = 'Select a shape, text, image, or video layer to edit color and fill.';
    const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Close'; b.onclick = closeFillDock;
    dock.append(h, b); return;
  }
  ensureFill(l);
  if (activeGradStop >= l.gradStops.length) activeGradStop = 0;
  const isMedia = l.type === 'image' || l.type === 'video';
  if (!['none','solid','gradient'].includes(fillSubTab)) fillSubTab = l.fillType || 'solid';

  const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };

  const head = mk('div', 'cf-head');
  const tabs = mk('div', 'cf-tabs');
  const bSolid = mk('button', fillSubTab === 'solid' ? 'on' : '', 'Solid Color');
  bSolid.type = 'button';
  bSolid.onclick = () => { fillSubTab = 'solid'; l.fillType = 'solid'; renderFillDock(); draw(); recordHistory(); };

  const bGrad = mk('button', fillSubTab === 'gradient' ? 'on' : '', 'Gradient');
  bGrad.type = 'button';
  bGrad.onclick = () => { fillSubTab = 'gradient'; l.fillType = 'gradient'; renderFillDock(); draw(); recordHistory(); };

  const bNone = mk('button', fillSubTab === 'none' ? 'on' : '', 'Normal');
  bNone.type = 'button';
  bNone.title = 'No color overlay or gradient';
  bNone.onclick = () => { fillSubTab = 'none'; l.fillType = 'none'; renderFillDock(); draw(); recordHistory(); };

  const bClose = mk('button', 'cf-close');
  bClose.type = 'button';
  bClose.innerHTML = uiIcon('close', 'ui-ico-sm') + '<span>Close</span>';
  bClose.onclick = closeFillDock;

  tabs.append(bSolid, bGrad, bNone);
  head.append(tabs, bClose);
  dock.append(head);

  const body = mk('div', 'cf-compact-body');

  if (fillSubTab === 'none') {
    const row = mk('div', 'cf-solid-row');
    row.append(mk('span', 'hint', 'Normal mode: layer renders without color fill or gradient overlay.'));
    body.append(row);
  } else if (fillSubTab === 'solid') {
    const row = mk('div', 'cf-solid-row');
    const colInp = document.createElement('input');
    colInp.type = 'color';
    colInp.value = /^#[0-9a-f]{6}$/i.test(l.color) ? l.color : '#8b5cf6';
    colInp.oninput = () => { l.fillType = 'solid'; l.color = colInp.value; draw(); };
    colInp.onchange = recordHistory;

    const lbl = mk('span', 'hint', isMedia ? 'Tint color over media:' : 'Pick a solid fill color:');
    const quick = mk('div', 'cf-quick-cols');
    PALETTE.forEach(c => {
      const qb = mk('button', ''); qb.type = 'button'; qb.style.background = c; qb.title = c;
      qb.onclick = () => { l.fillType = 'solid'; l.color = c; colInp.value = c; draw(); recordHistory(); };
      quick.append(qb);
    });
    row.append(lbl, colInp, quick);

    const colOpLbl = mk('span', 'hint', 'Color Alpha:');
    const colOpRng = document.createElement('input');
    colOpRng.type = 'range'; colOpRng.min = 0; colOpRng.max = 100; colOpRng.step = 1;
    colOpRng.value = Math.round((l.colorAlpha ?? 1) * 100);
    const colOpVal = mk('span', 'hint', `${colOpRng.value}%`);
    colOpRng.oninput = () => {
      l.fillType = 'solid';
      l.colorAlpha = +colOpRng.value / 100;
      colOpVal.textContent = `${colOpRng.value}%`;
      draw();
    };
    colOpRng.onchange = recordHistory;
    row.append(colOpLbl, colOpRng, colOpVal);

    if (isMedia) {
      const tintLbl = mk('span', 'hint', 'Tint Strength:');
      const tintRng = document.createElement('input');
      tintRng.type = 'range'; tintRng.min = 0; tintRng.max = 100; tintRng.step = 1;
      tintRng.value = Math.round((l.tintAlpha ?? 0.55) * 100);
      const tintVal = mk('span', 'hint', `${tintRng.value}%`);
      tintRng.oninput = () => {
        l.tintAlpha = +tintRng.value / 100;
        tintVal.textContent = `${tintRng.value}%`;
        draw();
      };
      tintRng.onchange = recordHistory;
      row.append(tintLbl, tintRng, tintVal);
    }

    body.append(row);
  } else {
    const gRow = mk('div', 'cf-grad-compact');
    const kinds = mk('div', 'cf-kind-group');
    const rx = Math.max(60, (l.w || 240) * 0.45);
    const ry = Math.max(60, (l.h || 240) * 0.45);

    const bRad = mk('button', l.gradKind === 'radial' ? 'on' : '');
    bRad.type = 'button';
    bRad.innerHTML = uiIcon('radial', 'ui-ico-sm') + '<span>Radial</span>';
    bRad.onclick = () => {
      l.gradKind = 'radial';
      l.gradP1 = {x: 0, y: 0};
      l.gradP2 = {x: rx, y: 0};
      renderFillDock(); draw(); recordHistory();
    };

    const bLin = mk('button', l.gradKind === 'linear' ? 'on' : '');
    bLin.type = 'button';
    bLin.innerHTML = uiIcon('linear', 'ui-ico-sm') + '<span>Linear</span>';
    bLin.onclick = () => {
      l.gradKind = 'linear';
      l.gradP1 = {x: 0, y: -ry};
      l.gradP2 = {x: 0, y: ry};
      renderFillDock(); draw(); recordHistory();
    };
    kinds.append(bRad, bLin);

    const sliderWrap = mk('div', 'cf-slider-wrap');
    const track = mk('div', 'cf-grad-track');
    track.title = 'Drag diamond stops to adjust positions, or click track to add a stop';

    const updateTrackBg = () => {
      const sorted = getSortedStops(l);
      track.style.background = `linear-gradient(90deg, ${sorted.map(s => `${hexToRgba(s.color, s.alpha ?? 1)} ${(s.pos * 100).toFixed(1)}%`).join(', ')})`;
    };
    updateTrackBg();

    const stopEdit = mk('div', 'cf-stop-edit');
    const colInp = document.createElement('input');
    colInp.type = 'color';
    const opRng = document.createElement('input');
    opRng.type = 'range'; opRng.min = 0; opRng.max = 100; opRng.step = 1;
    const opVal = mk('span', 'hint', '100%');
    const delStopBtn = mk('button', '', 'Delete Stop');
    delStopBtn.type = 'button';

    const syncStopEditor = () => {
      const st = l.gradStops[activeGradStop] || l.gradStops[0];
      colInp.value = /^#[0-9a-f]{6}$/i.test(st.color) ? st.color : '#ffffff';
      const pct = Math.round((st.alpha ?? 1) * 100);
      opRng.value = pct;
      opVal.textContent = `${pct}%`;
      delStopBtn.disabled = l.gradStops.length <= 2;
    };

    const renderDiamonds = () => {
      track.querySelectorAll('.cf-diamond').forEach(el => el.remove());
      l.gradStops.forEach((st, idx) => {
        const dm = mk('div', 'cf-diamond' + (idx === activeGradStop ? ' on' : ''));
        dm.style.left = (st.pos * 100) + '%';
        dm.style.background = hexToRgba(st.color, st.alpha ?? 1);
        dm.title = `Stop ${idx + 1} (${Math.round(st.pos * 100)}%) — Drag to adjust`;

        dm.onpointerdown = ev => {
          ev.stopPropagation();
          activeGradStop = idx;
          syncStopEditor();
          track.querySelectorAll('.cf-diamond').forEach((n, j) => n.classList.toggle('on', j === idx));
          dm.setPointerCapture(ev.pointerId);
          let dragging = true, moved = false;
          dm.onpointermove = e2 => {
            if (!dragging) return;
            moved = true;
            const r = track.getBoundingClientRect();
            const np = Math.max(0, Math.min(1, (e2.clientX - r.left) / Math.max(1, r.width)));
            st.pos = +np.toFixed(3);
            dm.style.left = (st.pos * 100) + '%';
            updateTrackBg();
            draw();
          };
          dm.onpointerup = () => {
            dragging = false;
            dm.onpointermove = dm.onpointerup = null;
            if (moved) recordHistory();
          };
        };
        track.append(dm);
      });
    };

    track.onpointerdown = e => {
      if (e.target.classList.contains('cf-diamond')) return;
      const r = track.getBoundingClientRect();
      const pos = +Math.max(0, Math.min(1, (e.clientX - r.left) / Math.max(1, r.width))).toFixed(3);
      const baseStop = l.gradStops[activeGradStop] || l.gradStops[0];
      l.gradStops.push({pos, color: baseStop.color, alpha: baseStop.alpha ?? 1});
      activeGradStop = l.gradStops.length - 1;
      updateTrackBg();
      renderDiamonds();
      syncStopEditor();
      draw();
      recordHistory();
    };

    colInp.oninput = () => {
      const st = l.gradStops[activeGradStop];
      if (!st) return;
      st.color = colInp.value;
      const dm = track.querySelectorAll('.cf-diamond')[activeGradStop];
      if (dm) dm.style.background = hexToRgba(st.color, st.alpha ?? 1);
      updateTrackBg();
      draw();
    };
    colInp.onchange = recordHistory;

    opRng.oninput = () => {
      const st = l.gradStops[activeGradStop];
      if (!st) return;
      st.alpha = +opRng.value / 100;
      opVal.textContent = `${opRng.value}%`;
      const dm = track.querySelectorAll('.cf-diamond')[activeGradStop];
      if (dm) dm.style.background = hexToRgba(st.color, st.alpha ?? 1);
      updateTrackBg();
      draw();
    };
    opRng.onchange = recordHistory;

    delStopBtn.onclick = () => {
      if (l.gradStops.length <= 2) return;
      l.gradStops.splice(activeGradStop, 1);
      activeGradStop = Math.max(0, activeGradStop - 1);
      updateTrackBg();
      renderDiamonds();
      syncStopEditor();
      draw();
      recordHistory();
    };

    renderDiamonds();
    syncStopEditor();

    sliderWrap.append(track);
    stopEdit.append('Color:', colInp, 'Alpha:', opRng, opVal, delStopBtn);
    gRow.append(kinds, sliderWrap, stopEdit);

    if (isMedia) {
      const tintLbl = mk('span', 'hint', 'Gradient Strength:');
      const tintRng = document.createElement('input');
      tintRng.type = 'range'; tintRng.min = 0; tintRng.max = 100; tintRng.step = 1;
      tintRng.value = Math.round((l.tintAlpha ?? 0.55) * 100);
      tintRng.style.width = '90px'; tintRng.style.accentColor = 'var(--ac)';
      const tintVal = mk('span', 'hint', `${tintRng.value}%`);
      tintRng.oninput = () => {
        l.tintAlpha = +tintRng.value / 100;
        tintVal.textContent = `${tintRng.value}%`;
        draw();
      };
      tintRng.onchange = recordHistory;
      gRow.append(tintLbl, tintRng, tintVal);
    }

    body.append(gRow);
  }

  dock.append(body);
}

}

  $('fxbrowser').classList.remove('open');
}
$('fxbClose').onclick = closeFxBrowser;
$('fxbrowser').onclick = e => { if (e.target === $('fxbrowser')) closeFxBrowser(); };

function renderFxBrowser(q) {
  const body = $('fxbBody'); body.innerHTML = '';
  const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };
  const mkSecTitle = (ico, title) => {
    const d = mk('div', 'fxb-sec-title');
    d.innerHTML = uiIcon(ico, 'ui-ico-sm') + `<span>${title}</span>`;
    return d;
  };
  const match = item => !q || item.name.toLowerCase().includes(q) || item.cat.toLowerCase().includes(q) || item.id.toLowerCase().includes(q);

  const popItems = FX_CATALOG.filter(x => x.popular && match(x));
  if (popItems.length) {
    const sec = mk('div');
    sec.append(mkSecTitle('flame', 'Popular'));
    const row = mk('div', 'fxb-pop-row');
    popItems.forEach(fx => {
      const b = mk('button', 'fxb-pop-card'); b.type = 'button';
      b.innerHTML = `<img class="fxb-pop-img" src="${fx.img}" alt="${fx.name}"><span>${fx.name}</span>`;
      b.onclick = () => addEffectToLayer(fx.id);
      row.append(b);
    });
    sec.append(row); body.append(sec);
  }

  const recItems = recentFx.map(id => FX_CATALOG.find(x => x.id === id)).filter(x => x && match(x));
  if (recItems.length) {
    const sec = mk('div');
    sec.append(mkSecTitle('clock', 'Recently Used'));
    const wrap = mk('div', 'fxb-recent-wrap');
    recItems.forEach(fx => {
      const b = mk('button', 'fxb-recent-chip'); b.type = 'button';
      b.innerHTML = `<img class="fxb-recent-img" src="${fx.img}" alt="${fx.name}"><span>${fx.name}</span>`;
      b.onclick = () => addEffectToLayer(fx.id);
      wrap.append(b);
    });
    sec.append(wrap); body.append(sec);
  }

  const allSec = mk('div');
  allSec.append(mkSecTitle('sparkles', 'All Effects'));
  const catsGrid = mk('div', 'fxb-cats');
  FX_CATS.forEach(catName => {
    const list = FX_CATALOG.filter(x => x.cat === catName && match(x));
    if (!list.length) return;
    const box = mk('div', 'fxb-cat-box');
    box.append(mk('div', 'fxb-cat-head', catName));
    const cl = mk('div', 'fxb-cat-list');
    list.forEach(fx => {
      const b = mk('button', 'fxb-item'); b.type = 'button';
      b.innerHTML = `<span class="fxb-item-left"><img class="fxb-item-img" src="${fx.img}" alt="${fx.name}"><span>${fx.name}</span></span><small>+ Add</small>`;
      b.onclick = () => addEffectToLayer(fx.id);
      cl.append(b);
    });
    box.append(cl); catsGrid.append(box);
  });
  allSec.append(catsGrid); body.append(allSec);
}

function trimLayer(side) {
  const l = cur();
  if (!l) return;
  let changed = false;
  if (side === 'left') {
    if (t > l.st && t < l.en - 1/FPS) {
      if (l.type === 'video' || l.type === 'audio') l.off = (l.off || 0) + (t - l.st) * (l.speed || 1);
      l.st = t; changed = true;
    }
  } else {
    if (t > l.st + 1/FPS && t < l.en) { l.en = t; changed = true; }
  }
  if (changed) { refresh(); recordHistory(); }
}

function splitAnyLayer() {
  const l = cur();
  if (!l || !(t > l.st + 0.001 && t < l.en - 0.001)) return;
  if (playing) stop();
  const sp = l.speed || 1;
  const r = JSON.parse(JSON.stringify(l, (k, v) => k === 'el' ? undefined : v));
  r.id = uid++; r.st = t; r.en = l.en; l.en = t;
  if (l.type === 'video' || l.type === 'audio') { r.off = (l.off || 0) + (t - l.st) * sp; hydrate(r, false); }
  layers.splice(layers.indexOf(l) + 1, 0, r);
  refresh();
  recordHistory();
}

function renderCustomEffectControls(card, ef, l) {
  ensureEffectProps(ef);
  const p = ef.p;
  const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
  const addSlider = (label, key, min, max, step, unit = '', onChangeExtra) => {
    const row = mk('div', 'fx-param-row');
    const lbl = mk('span', '', label); lbl.style.textAlign = 'start';
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = p[key];
    const val = mk('span', '', `${p[key]}${unit}`);
    inp.oninput = () => {
      p[key] = +inp.value;
      val.textContent = `${p[key]}${unit}`;
      if (onChangeExtra) onChangeExtra(+inp.value);
      draw();
    };
    inp.onchange = recordHistory;
    row.append(lbl, inp, val);
    card.append(row);
  };
  const addSelect = (label, key, options, onChangeExtra) => {
    const row = mk('div', 'fx-sel-row');
    row.append(mk('span', '', label));
    const selEl = document.createElement('select');
    options.forEach(([v, txt]) => selEl.add(new Option(txt, v)));
    selEl.value = p[key];
    selEl.onchange = () => {
      p[key] = selEl.value;
      if (onChangeExtra) onChangeExtra(selEl.value);
      draw();
      recordHistory();
    };
    row.append(selEl);
    card.append(row);
  };
  const addToggle = (label, key) => {
    const b = mk('button', 'fx-toggle-btn' + (p[key] ? ' on' : ''));
    b.type = 'button';
    b.innerHTML = `<span>${label}</span><b>${p[key] ? 'ON' : 'OFF'}</b>`;
    b.onclick = () => {
      p[key] = !p[key];
      b.classList.toggle('on', !!p[key]);
      b.querySelector('b').textContent = p[key] ? 'ON' : 'OFF';
      draw();
      recordHistory();
    };
    card.append(b);
  };

  if (ef.id === 'autoshake') {
    addSlider('Magnitude', 'magnitude', 0, 120, 1, 'px', v => { ef.val = v; });
    addSlider('Frequency', 'frequency', 0.5, 30, 0.5, 'Hz');
    addSlider('Evolution', 'evolution', -50, 50, 1, '');
    addSlider('Seed', 'seed', 1, 999, 1, '');
    addSlider('Angle', 'angle', -180, 180, 1, '°');
    addSlider('Slack', 'slack', 0.05, 1, 0.05, '');
    addSlider('Z Shake', 'zShake', 0, 80, 1, '');
  } else if (ef.id === 'movealongpath') {
    addSlider('Progress', 'progress', 0, 1, 0.01, '', v => { ef.val = v; });
    addSlider('Orientation', 'orientation', -180, 180, 1, '°');
    addToggle('Rotate Automatically', 'rotateAuto');
    addSlider('Inset/Outset', 'insetOutset', -250, 250, 1, 'px');
    addSlider('Offset X', 'offsetX', -300, 300, 1, 'px');
    addSlider('Offset Y', 'offsetY', -300, 300, 1, 'px');
  } else if (ef.id === 'offsetfx') {
    addSlider('Offset X', 'offsetX', -400, 400, 1, 'px', v => { ef.val = v; });
    addSlider('Offset Y', 'offsetY', -400, 400, 1, 'px');
    addSlider('Feather', 'feather', 0, 40, 1, 'px');
    const layerOpts = [['none', 'None'], ...layers.filter(x => x.id !== l.id).map(x => [String(x.id), x.name])];
    addSelect('Mark To Layer', 'markToLayer', layerOpts);
  } else if (ef.id === 'oscillate') {
    addSelect('Direction', 'direction', [['angle','Angle'], ['depth','Depth'], ['orbit','Orbit']], () => drawAMTools());
    const dir = p.direction || 'angle';
    if (dir === 'angle') {
      addSlider('Angle', 'angle', -180, 180, 1, '°');
      addSlider('Frequency', 'frequency', 0.2, 20, 0.2, 'Hz');
      addSlider('Magnitude', 'magnitude', 0, 120, 1, 'px', v => { ef.val = v; });
      addSelect('Wave', 'wave', [['sine','Sine'], ['triangle','Triangle']]);
      addSlider('Phase', 'phase', -180, 180, 1, '°');
    } else if (dir === 'depth') {
      addSlider('Frequency', 'frequency', 0.2, 20, 0.2, 'Hz');
      addSlider('Magnitude', 'magnitude', 0, 120, 1, 'px', v => { ef.val = v; });
      addSelect('Wave', 'wave', [['sine','Sine'], ['triangle','Triangle']]);
      addSlider('Phase', 'phase', -180, 180, 1, '°');
    } else {
      addSlider('Angle', 'angle', -180, 180, 1, '°');
      addSlider('Frequency', 'frequency', 0.2, 20, 0.2, 'Hz');
      addSlider('Magnitude', 'magnitude', 0, 120, 1, 'px', v => { ef.val = v; });
      addSelect('Wave', 'wave', [['sine','Sine'], ['triangle','Triangle']]);
      addSlider('Phase', 'phase', -180, 180, 1, '°');
    }
  } else if (ef.id === 'tiles') {
    addSlider('Scale', 'scaleDummy', 1, 6, 0.5, '×');
    const scRow = card.lastChild;
    const scInp = scRow.querySelector('input');
    const scVal = scRow.querySelectorAll('span')[1];
    scInp.value = ef.val;
    scVal.textContent = `${ef.val}×`;
    scInp.oninput = () => { ef.val = +scInp.value; scVal.textContent = `${ef.val}×`; draw(); };
    scInp.onchange = recordHistory;

    addSlider('Crop', 'crop', 0, 0.45, 0.01, '');
    addSlider('Offset', 'offset', -200, 200, 1, 'px');
    addToggle('Mirror', 'mirror');
    addToggle('Offset Vertically', 'offsetVertically');
    addSlider('Angle', 'angle', -180, 180, 1, '°');
  } else {
    const spec = FX_CATALOG.find(x => x.id === ef.id) || {min:0, max:100, step:1, unit:''};
    const rng = mk('input'); rng.type = 'range';
    rng.min = spec.min ?? 0; rng.max = spec.max ?? 100; rng.step = spec.step ?? 1; rng.value = ef.val;
    const valLbl = mk('span', 'hint', `${ef.val}${spec.unit || ''}`);
    rng.oninput = () => { ef.val = +rng.value; valLbl.textContent = `${ef.val}${spec.unit || ''}`; draw(); };
    rng.onchange = recordHistory;
    const row = mk('label'); row.append('Amount', rng);
    card.append(row, valLbl);
  }
}

function drawAMTools() {
  const box = $('ambox'), l = cur();
  if (!l) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false; box.innerHTML = '';
  const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };
  const toggleTab = k => { amTab = (amTab === k) ? null : k; drawAMTools(); };

  if (amTab === 'effects') {
    const head = mk('div', 'am-sub');
    const backB = mk('button', 'fx-back', '← Back to Tools');
    backB.onclick = () => { amTab = null; drawAMTools(); };
    const addB = mk('button', 'fx-add-btn', '+ Add Effect');
    addB.onclick = openFxBrowser;
    head.append(backB, addB);
    box.append(head);

    const effs = getEffects(l);
    if (!effs.length) {
      box.append(mk('div', 'hint', 'No effects on this layer yet. Click "+ Add Effect" to open the Effects Browser.'));
      return;
    }
    effs.forEach((ef, idx) => {
      const spec = FX_CATALOG.find(x => x.id === ef.id) || {name: ef.id, img: makeFxThumb(ef.id), min:0, max:100, step:1, unit:''};
      const card = mk('div', 'fx-card');
      const top = mk('div', 'fx-top');
      const left = mk('span', 'fx-top-left');
      left.innerHTML = `<img class="fx-mini-img" src="${spec.img}" alt="${spec.name}"><span>${spec.name}</span>`;
      top.append(left);
      const delB = mk('button', ''); delB.innerHTML = uiIcon('close', 'ui-ico-sm'); delB.title = 'Remove Effect';
      delB.onclick = () => { effs.splice(idx, 1); draw(); drawAMTools(); recordHistory(); };
      top.append(delB);
      card.append(top);
      renderCustomEffectControls(card, ef, l);
      box.append(card);
    });
    return;
  }

  const bar = mk('div', 'am-bar');
  const bSpd = mk('button', amTab === 'speed' ? 'on' : ''); bSpd.innerHTML = amSvg('speed'); bSpd.title = 'Speed';
  bSpd.disabled = l.type !== 'video'; bSpd.onclick = () => toggleTab('speed');

  const bTrL = mk('button'); bTrL.innerHTML = amSvg('trimL'); bTrL.title = 'Trim Left at Playhead';
  bTrL.onclick = () => trimLayer('left');

  const bSpl = mk('button'); bSpl.innerHTML = amSvg('split'); bSpl.title = 'Split Layer at Playhead';
  bSpl.onclick = splitAnyLayer;

  const bTrR = mk('button'); bTrR.innerHTML = amSvg('trimR'); bTrR.title = 'Trim Right at Playhead';
  bTrR.onclick = () => trimLayer('right');

  const bMut = mk('button', l.mute ? 'on' : ''); bMut.innerHTML = amSvg('mute'); bMut.title = l.mute ? 'Unmute Audio' : 'Mute Audio';
  bMut.disabled = !['video', 'audio'].includes(l.type);
  bMut.onclick = () => { l.mute = !l.mute; applyGain(l); refresh(); recordHistory(); };

  bar.append(bSpd, bTrL, bSpl, bTrR, bMut);
  box.append(bar);

  const grid = mk('div', 'am-grid');
  const isFillOpen = document.body.classList.contains('fill-open');
  const items = [
    ['color', 'Color & Fill', () => toggleFillDock()],
    ['border', 'Border & Shadow', () => toggleTab('border')],
    ['blend', 'Blending & Opacity', () => toggleTab('blend')],
    ['move', 'Move & Transform', () => openDock()],
    ['shape', l.type === 'text' ? 'Edit Text' : 'Edit Shape', () => toggleTab('shape')],
    ['presets', 'Presets', () => toggleTab('presets')],
    ['effects', `Effects (${getEffects(l).length})`, () => toggleTab('effects')]
  ];
  items.forEach(([ic, title, fn]) => {
    const active = (ic === 'color' && isFillOpen) || amTab === ic;
    const b = mk('button', active ? 'on' : '');
    b.type = 'button';
    b.innerHTML = `${amSvg(ic)}<span>${title}</span>`;
    b.onclick = fn;
    grid.append(b);
  });
  box.append(grid);

  if (!amTab) return;
  const sub = mk('div', 'am-sub');
  const addRow = (lbl, el) => { const w = mk('label'); w.append(lbl, el); sub.append(w); };
  const mkPresetBtn = (ico, txt, fn) => {
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = uiIcon(ico, 'ui-ico-sm') + ` <span>${txt}</span>`;
    b.onclick = fn;
    return b;
  };

  if (amTab === 'speed' && l.type === 'video') {
    const inp = mk('input'); inp.type = 'number'; inp.min = 0.25; inp.max = 4; inp.step = 0.25; inp.value = l.speed || 1;
    inp.onchange = () => { setSpeed(inp.value); recordHistory(); };
    addRow('Speed', inp);
    const pr = mk('div', 'two');
    [0.5, 1, 1.5, 2].forEach(v => {
      const b = mk('button', (l.speed || 1) === v ? 'on' : '', v + '×');
      b.onclick = () => { setSpeed(v); recordHistory(); };
      pr.append(b);
    });
    sub.append(pr);
  } else if (amTab === 'border') {
    const sw = mk('input'); sw.type = 'range'; sw.min = 0; sw.max = 40; sw.value = l.strokeW || 0;
    sw.oninput = () => { l.strokeW = +sw.value; draw(); };
    sw.onchange = recordHistory;
    addRow('Stroke Width', sw);

    const sc = mk('input'); sc.type = 'color'; sc.value = l.strokeC || '#000000';
    sc.oninput = () => { l.strokeC = sc.value; draw(); };
    sc.onchange = recordHistory;
    addRow('Stroke Color', sc);

    const shBtn = mk('button', l.shOn ? 'on' : '', l.shOn ? 'Shadow: ON' : 'Shadow: OFF');
    shBtn.onclick = () => { l.shOn = !l.shOn; draw(); drawAMTools(); recordHistory(); };
    sub.append(shBtn);

    if (l.shOn) {
      const shc = mk('input'); shc.type = 'color'; shc.value = l.shC || '#000000';
      shc.oninput = () => { l.shC = shc.value; draw(); };
      shc.onchange = recordHistory;
      addRow('Shadow Color', shc);

      const shb = mk('input'); shb.type = 'range'; shb.min = 0; shb.max = 60; shb.value = l.shBlur ?? 16;
      shb.oninput = () => { l.shBlur = +shb.value; draw(); };
      shb.onchange = recordHistory;
      addRow('Shadow Blur', shb);
    }
  } else if (amTab === 'blend') {
    const op = mk('input'); op.type = 'range'; op.min = 0; op.max = 1; op.step = 0.01; op.value = get(l, 'op', t);
    op.oninput = () => { setProp(l, 'op', +op.value); draw(); renderTimeline(); };
    op.onchange = recordHistory;
    addRow('Opacity', op);

    const selB = mk('select');
    [['source-over','Normal'],['multiply','Multiply'],['screen','Screen'],['overlay','Overlay'],['darken','Darken'],['lighten','Lighten'],['difference','Difference']].forEach(([v, n]) => selB.add(new Option(n, v)));
    selB.value = l.blend || 'source-over';
    selB.onchange = () => { l.blend = selB.value; draw(); recordHistory(); };
    addRow('Blend Mode', selB);
  } else if (amTab === 'shape') {
    if (l.type === 'text') {
      const tx = mk('input'); tx.type = 'text'; tx.value = l.text;
      tx.oninput = () => { l.text = tx.value; draw(); drawProps(); };
      tx.onchange = recordHistory;
      addRow('Text', tx);

    dur: clamp($('pdur').value, 1, 60, 5),
    bg: pickBg
  });
  layers = []; uid = 1; sel = null; setTime(0); refresh(); closeDialog(); recordHistory();
};
$('pcancel').onclick = closeDialog;
$('newp').onclick = openDialog;

function applyProject(p) {
  P = {...p}; cv.width = p.w; cv.height = p.h; DUR = p.dur; FPS = p.fps;
  $('time').max = DUR; $('time').step = 1/FPS;
  PPS = Math.max(40, Math.min(600, Math.floor(Math.max(200, ($('tlscroll').clientWidth || 800) - G - 40) / DUR)));
  if ($('zoom')) $('zoom').value = PPS;
  cv.style.background = p.bg || 'repeating-conic-gradient(#777 0% 25%,#bbb 0% 50%) 50%/20px 20px';
  $('pname').textContent = `${p.name} · ${p.w}×${p.h} · ${p.fps} FPS`;
  document.title = p.name + ' — Motion Editor';
}
renderTransportControls();
applyProject(P); setTime(0); refresh(); recordHistory(); openDialog();
</script>
</body>
</html>
